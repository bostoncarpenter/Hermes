name: agent-web-spine

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    shm_size: "128mb"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d postgres -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "127.0.0.1:8432:5432"
    networks: [spine]

  # Published images are stale — build API + dashboard from the same pinned
  # upstream commit. Bump MEM0_REF in .env to upgrade.
  mem0:
    build:
      context: "https://github.com/mem0ai/mem0.git#${MEM0_REF:?Set MEM0_REF in .env}:server"
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DASHBOARD_URL=http://localhost:3000
      - APP_DB_NAME=mem0_app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:?Set GOOGLE_API_KEY in .env}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - MEM0_TELEMETRY=${MEM0_TELEMETRY:-false}
    volumes:
      - mem0_history:/app/history
    depends_on:
      postgres:
        condition: service_healthy
    networks: [spine]

  mem0-dashboard:
    build:
      context: "https://github.com/mem0ai/mem0.git#${MEM0_REF}:server/dashboard"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8888
      - API_INTERNAL_URL=http://mem0:8000
      - NEXT_PUBLIC_INSTANCE_NAME=Mem0
    depends_on:
      mem0:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [spine]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Gemini's OpenAI-compatible endpoint — chat models, not the memory API.
      - OPENAI_API_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
      - OPENAI_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - open_webui:/app/backend/data
    networks: [spine]

volumes:
  postgres_db:
  mem0_history:
  open_webui:

networks:
  spine:
    driver: bridge
